<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Systems Dashboard</title>
    <style>
        /* Modern Minimalist UI Reset */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        
        body { 
            background-color: #f4f6f9; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 1rem; 
        }

        /* Central Authorized Portal Card */
        .dashboard-box { 
            background: #ffffff; 
            padding: 3rem 2.5rem; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(44, 62, 80, 0.08); 
            width: 100%; 
            max-width: 480px; 
            text-align: center; 
            border: 1px solid #eef2f5; 
        }

        h1 { 
            color: #16a34a; 
            font-size: 2.2rem; 
            font-weight: 700; 
            margin-bottom: 0.8rem; 
            letter-spacing: -0.5px;
        }

        p { 
            color: #475569; 
            font-size: 1.1rem; 
            margin-bottom: 2.5rem; 
            font-weight: 500;
        }

        /* Hardened Security Terminate Interactive Control */
        .btn-logout { 
            display: block; 
            width: 100%;
            text-decoration: none; 
            background-color: #e11d48; 
            color: #ffffff; 
            padding: 0.85rem; 
            font-weight: 600; 
            font-size: 1rem;
            border-radius: 8px; 
            transition: all 0.2s ease-in-out; 
        }

        /* Hover Feedback loop */
        .btn-logout:hover { 
            background-color: #be123c; 
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.2);
        }

        .btn-logout:active {
            transform: translateY(1px);
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="dashboard-box">
        <h1>Access Granted</h1>
        <p>Welcome back Dear, <strong>{{ username }}</strong>!</p>
        <button type="button" class="btn-logout" onclick="window.location.href='{% url 'logout_url' %}'">Terminate Session (Logout)</button>
        {% comment %} <a href="{% url 'logout_url' %}" class="btn-logout">Terminate Session (Logout)</a> {% endcomment %}
    </div>

</body>
</html>
